name: Deploy pygbag build to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pygbag
      - run: pygbag --build web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/build/web
      - id: deployment
        uses: actions/deploy-pages@v4